<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#9C035D" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="vsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6" />

  <!-- Word Duel Tiles Layout -->
  <g filter="url(#shadow)">
    <!-- Main Center Tile -->
    <rect x="116" y="96" width="280" height="280" rx="44" fill="url(#tileGrad)" />
    
    <!-- Bold 'K' Letter -->
    <path d="M192 166 V306 M192 236 L286 166 M232 214 L302 306" 
          stroke="#1E1B4B" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Small Score Number in top right of tile -->
    <text x="354" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#6B7280" text-anchor="middle">1</text>
  </g>

  <!-- VS Duel Badge at Bottom Center -->
  <g filter="url(#shadow)">
    <rect x="176" y="340" width="160" height="74" rx="37" fill="#0F172A" stroke="url(#vsGrad)" stroke-width="5" />
    <text x="256" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">VS</text>
  </g>
</svg>
