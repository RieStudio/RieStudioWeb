<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C035D" />
      <stop offset="50%" stop-color="#6F0443" />
      <stop offset="100%" stop-color="#1E0A24" />
    </linearGradient>
    <linearGradient id="tileGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#D90429" />
    </linearGradient>
    <linearGradient id="tileGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect width="118" height="118" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Central Game Duel Stylized 'K' & Word Tiles -->
  <g filter="url(#tileShadow)">
    <!-- Vertical Stem -->
    <rect x="30" y="26" width="16" height="68" rx="8" fill="url(#tileGrad2)" />
    
    <!-- Top-Right Diagonal Arm -->
    <path d="M48 56 L69 33 C72 29.5 77 29.5 80.5 32.5 C84 35.5 84 40.5 81 44 L62 64 Z" fill="url(#tileGrad1)" />
    
    <!-- Bottom-Right Diagonal Leg -->
    <path d="M57 59 L79 86 C82 89.5 81.5 94.5 78 97.5 C74.5 100.5 69.5 100 66 96.5 L46 72 Z" fill="url(#tileGrad2)" />

    <!-- Duel Accent Spark -->
    <circle cx="86" cy="30" r="4" fill="#FFB703" />
    <circle cx="84" cy="98" r="3" fill="#FF3366" />
  </g>
</svg>
